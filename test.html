<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BoxMaker — self-checks</title>
  <style>
    body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 2rem; }
    h1 { font-size: 1.2rem; }
    li { margin: .15rem 0; }
    .ok { color: #157f3b; }
    .fail { color: #c0392b; font-weight: 700; }
    #summary { margin: 1rem 0; font-weight: 700; }
  </style>
</head>
<body>
  <h1>BoxMaker — self-checks</h1>
  <div id="summary">corriendo…</div>
  <ul id="results"></ul>

  <script type="module">
    import { computeSegments, edgeProfile, jointIntervals } from './js/core/finger-joint.js';
    import { panelOutline, pocketFeature, holeFeature } from './js/core/panel.js';
    import { boundingBox } from './js/core/geometry.js';
    import { buildBox, autoTabWidth } from './js/boxes/simple-box.js';
    import { buildSlidingBox } from './js/boxes/sliding-box.js';
    import { buildHingedBox } from './js/boxes/hinged-box.js';
    import { renderBox } from './js/render/svg-render.js';
    import {
      gripDiameterFor, gripStemSpanFor, gripGeometry, crossHoleFeature,
      buildTopHole, buildInsertPanel, buildHandlePanels, validateGrip, gripWarnings,
    } from './js/boxes/lid-grip.js';
    import {
      evenPositions, buildLengthDividerPoints, buildHeightDividerPoints,
    } from './js/boxes/dividers.js';

    const results = [];
    const TOL = 1e-6;
    const near = (a, b, tol = TOL) => Math.abs(a - b) <= tol;
    const assert = (cond, msg) => { if (!cond) throw new Error(msg); };
    const check = (name, fn) => {
      try { fn(); results.push({ name, ok: true }); }
      catch (e) { results.push({ name, ok: false, msg: e.message }); }
    };

    const BASE = {
      length: 200, width: 150, height: 80,
      thickness: 3, kerf: 0.15, tabWidth: 18,
      dimensionMode: 'outer',
    };
    const FLAT = { ...BASE, lidType: 'flat' };
    const SLIDE = {
      length: 80, width: 80, height: 80,
      thickness: 3, kerf: 0.16, tabWidth: 12,
      dimensionMode: 'outer', lidType: 'sliding',
      slideClearance: 0.2,
    };
    // Los checks de geometría corren sobre los tres tipos de tapa, y cada tipo
    // lo arma un módulo distinto.
    const buildAny = (cfg) => (cfg.lidType === 'sliding' ? buildSlidingBox(cfg) : buildBox(cfg));
    const box = buildBox(BASE);
    const panel = (id) => box.panels.find((p) => p.id === id);
    const t = BASE.thickness;

    // Geometría congelada de la caja que Dani cortó y validó (kerf 0.16, 3 mm).
    // Si este check se pone rojo, algo cambió la caja cerrada: no seguir.
    const GOLDEN = await fetch('./test/golden-finger-80.json').then((r) => r.json());
    const GOLDEN_PARAMS = {
      length: 80, width: 80, height: 80,
      thickness: 3, kerf: 0.16, tabWidth: 12,
      dimensionMode: 'outer', lidType: 'finger',
    };

    check('regresión: la caja cerrada de 80×80×80 en 3 mm sigue idéntica', () => {
      const current = buildBox(GOLDEN_PARAMS);
      assert(current.errors.length === 0, current.errors.join(' | '));
      const ids = Object.keys(GOLDEN);
      assert(current.panels.length === ids.length,
        `${current.panels.length} piezas, esperaba ${ids.length}`);
      for (const id of ids) {
        const panel = current.panels.find((p) => p.id === id);
        assert(panel, `falta la pieza ${id}`);
        assert(panel.points.length === GOLDEN[id].length,
          `${id}: ${panel.points.length} puntos, esperaba ${GOLDEN[id].length}`);
        panel.points.forEach((q, i) => {
          const [gx, gy] = GOLDEN[id][i];
          assert(near(q.x, gx, 1e-3) && near(q.y, gy, 1e-3),
            `${id}[${i}]: (${q.x}, ${q.y}), esperaba (${gx}, ${gy})`);
        });
      }
    });

    check('buildBox con parámetros válidos no produce errores', () => {
      assert(box.errors.length === 0, box.errors.join(' | '));
      assert(box.panels.length === 6, 'esperaba 6 paneles');
    });

    check('computeSegments: siempre impar, >= 3, y reconstruye el span', () => {
      for (const span of [80, 194, 144, 10, 7.5, 1000]) {
        for (const tab of [18, 9, 3, 50]) {
          const { count, width } = computeSegments(span, tab);
          assert(count % 2 === 1, `count par para span ${span}, tab ${tab}`);
          assert(count >= 3, `count < 3 para span ${span}, tab ${tab}`);
          assert(near(count * width, span), `los segmentos no suman el span ${span}`);
        }
      }
    });

    check('el patrón de la junta es palindrómico (aristas espejadas encajan)', () => {
      for (const span of [80, 194, 144, 33]) {
        const intervals = jointIntervals({ jointSpan: span, targetTabWidth: 18 });
        const mirrored = intervals.map(([a, b]) => [span - b, span - a]).reverse();
        intervals.forEach((iv, i) => {
          assert(near(iv[0], mirrored[i][0]) && near(iv[1], mirrored[i][1]),
            `patrón no simétrico en span ${span}`);
        });
      }
    });

    check('cada par de aristas macho/hembra comparte segmentación y géneros opuestos', () => {
      const pairs = [
        ['eje Z', panel('front').edges.left, panel('left').edges.left, 0],
        ['eje Z', panel('back').edges.right, panel('right').edges.right, 0],
        ['eje X', panel('front').edges.top, panel('top').edges.top, t],
        ['eje X', panel('back').edges.bottom, panel('bottom').edges.bottom, t],
        ['eje Y', panel('left').edges.top, panel('top').edges.left, 0],
        ['eje Y', panel('right').edges.bottom, panel('bottom').edges.right, 0],
      ];
      for (const [axis, female, male, offset] of pairs) {
        assert(female.gender === 'female' && male.gender === 'male', `${axis}: géneros mal asignados`);
        const spanF = female.jointSpan ?? null;
        const spanM = male.jointSpan ?? null;
        assert(spanF === null || spanM === null || near(spanF, spanM),
          `${axis}: spans distintos (${spanF} vs ${spanM})`);
      }
    });

    check('ninguna pieza tiene material más fino que el kerf (nada incortable)', () => {
      for (const cfg of [BASE, FLAT, SLIDE, { ...SLIDE, thickness: 6, lidThickness: 3, tabWidth: 18 }]) {
        for (const p of buildAny(cfg).panels) {
          for (let i = 0; i < p.points.length; i++) {
            const a = p.points[i];
            const b = p.points[(i + 1) % p.points.length];
            const len = Math.hypot(b.x - a.x, b.y - a.y);
            assert(len >= cfg.kerf - TOL,
              `${p.id} (tapa ${cfg.lidType ?? 'finger'}): segmento de ${len.toFixed(3)} mm en (${a.x.toFixed(3)},${a.y.toFixed(3)}) — el láser se lo come`);
          }
        }
      }
    });

    check('ningún contorno se dobla sobre sí mismo (líneas cortadas dos veces)', () => {
      const configs = [
        BASE,
        { ...BASE, kerf: 0.4, tabWidth: 25, length: 250, width: 200, height: 100 },
        { ...BASE, thickness: 6, tabWidth: 20 },
        FLAT,
        { ...FLAT, kerf: 0.4, tabWidth: 25, length: 250, width: 200, height: 100 },
        SLIDE,
        { ...SLIDE, kerf: 0.4, tabWidth: 25, length: 250, width: 200, height: 100 },
        { ...SLIDE, thickness: 6, lidThickness: 3, tabWidth: 18 },
      ];
      for (const cfg of configs) {
        const result = buildAny(cfg);
        if (result.errors.length > 0) continue;
        for (const p of result.panels) {
          const pts = p.points, n = pts.length;
          for (let i = 0; i < n; i++) {
            const a = pts[(i - 1 + n) % n], b = pts[i], c = pts[(i + 1) % n];
            const v1 = { x: b.x - a.x, y: b.y - a.y };
            const v2 = { x: c.x - b.x, y: c.y - b.y };
            const collinear = Math.abs(v1.x * v2.y - v1.y * v2.x) < 1e-6;
            const reversing = v1.x * v2.x + v1.y * v2.y < -1e-6;
            assert(!(collinear && reversing),
              `${p.id} (t=${cfg.thickness}, kerf=${cfg.kerf}): el contorno retrocede sobre sí mismo en (${b.x.toFixed(2)},${b.y.toFixed(2)})`);
          }
        }
      }
    });

    check('ninguna esquina queda colgando de un puente más fino que el kerf', () => {
      // Si las dos aristas que concurren en una esquina son hembra, sus ranuras
      // aíslan el bloque de la esquina: solo lo sujeta lo que sobra por dentro
      // de la profundidad de la ranura. Si eso es menor que el kerf, la esquina
      // se cae al cortar.
      for (const cfg of [BASE, { ...BASE, kerf: 0.4, tabWidth: 25 }, FLAT, { ...FLAT, kerf: 0.4, tabWidth: 25 },
                         SLIDE, { ...SLIDE, thickness: 6, lidThickness: 3, tabWidth: 18 }]) {
        const result = buildAny(cfg);
        if (result.errors.length > 0) continue;
        for (const p of result.panels) {
          const corners = [
            { x: 0, y: 0, sx: 1, sy: 1, h: 'top', v: 'left' },
            { x: p.width, y: 0, sx: -1, sy: 1, h: 'top', v: 'right' },
            { x: p.width, y: p.height, sx: -1, sy: -1, h: 'bottom', v: 'right' },
            { x: 0, y: p.height, sx: 1, sy: -1, h: 'bottom', v: 'left' },
          ];
          for (const c of corners) {
            if (p.edges[c.h].gender !== 'female' || p.edges[c.v].gender !== 'female') continue;
            const along = (fixedAxis, freeAxis, fixedValue, origin, sign) => {
              let best = Infinity;
              for (const q of p.points) {
                if (Math.abs(q[fixedAxis] - fixedValue) > TOL) continue;
                const d = (q[freeAxis] - origin) * sign;
                if (d > TOL && d < best) best = d;
              }
              return best;
            };
            const offsetH = along('y', 'x', c.y, c.x, c.sx);
            const offsetV = along('x', 'y', c.x, c.y, c.sy);
            const bridge = Math.min(offsetH, offsetV) - cfg.thickness;
            assert(bridge > cfg.kerf,
              `${p.id} (kerf=${cfg.kerf}): la esquina (${c.x},${c.y}) queda sujeta por ${bridge.toFixed(3)} mm de material`);
          }
        }
      }
    });

    check('las esquinas de front/back quedan macizas', () => {
      for (const id of ['front', 'back']) {
        const p = panel(id);
        const corners = [[0, 0], [p.width, 0], [p.width, p.height], [0, p.height]];
        for (const [cx, cy] of corners) {
          assert(p.points.some((q) => near(q.x, cx) && near(q.y, cy)),
            `${id}: falta el vértice de la esquina (${cx}, ${cy})`);
          for (const q of p.points) {
            if (near(q.x, cx) && near(q.y, cy)) continue;
            assert(Math.max(Math.abs(q.x - cx), Math.abs(q.y - cy)) >= t - TOL,
              `${id}: el punto (${q.x.toFixed(3)},${q.y.toFixed(3)}) invade la esquina (${cx}, ${cy})`);
          }
        }
      }
    });

    check('las ranuras que tocan un borde llegan hasta el borde', () => {
      for (const gender of ['female', 'male']) {
        const profile = edgeProfile({
          edgeLength: 100, gender, thickness: t, kerf: 0.2, targetTabWidth: 20,
        });
        assert(near(profile[1].u, 0),
          `${gender}: la primera feature arranca en u=${profile[1].u}, debería tocar el borde`);
        const last = profile[profile.length - 2];
        assert(near(last.u, 100),
          `${gender}: la última feature termina en u=${last.u}, debería tocar el borde`);
      }
    });

    check('los tabs del macho caen exactamente en las ranuras de la hembra', () => {
      // Lee las aristas reales de la caja, no una copia del modelo.
      const edge = (id, side) => {
        const p = panel(id);
        const spec = p.edges[side];
        const length = side === 'top' || side === 'bottom' ? p.width : p.height;
        return { ...spec, jointStart: spec.jointStart ?? 0, jointSpan: spec.jointSpan ?? length };
      };
      const pairs = [
        ['eje Z (front–left)', edge('front', 'left'), edge('left', 'left')],
        ['eje X (front–top)', edge('front', 'top'), edge('top', 'top')],
        ['eje Y (left–top)', edge('left', 'top'), edge('top', 'left')],
      ];
      for (const [name, female, male] of pairs) {
        assert(female.gender === 'female' && male.gender === 'male', `${name}: géneros mal asignados`);
        assert(near(female.jointSpan, male.jointSpan),
          `${name}: spans distintos (${female.jointSpan} vs ${male.jointSpan})`);
        const shift = female.jointStart - male.jointStart;
        const f = jointIntervals({ ...female, targetTabWidth: BASE.tabWidth });
        const m = jointIntervals({ ...male, targetTabWidth: BASE.tabWidth })
          .map(([a, b]) => [a + shift, b + shift]);
        assert(f.length === m.length, `${name}: distinto número de espigas`);
        f.forEach((iv, i) => {
          assert(near(iv[0], m[i][0]) && near(iv[1], m[i][1]), `${name}: espiga ${i} desalineada`);
        });
      }
    });

    check('kerf: el tab macho se dibuja un kerf más ancho y la ranura hembra un kerf más angosta', () => {
      const common = { edgeLength: 80, thickness: t, kerf: 0.15, targetTabWidth: 18, jointSpan: 80 };
      const { width } = computeSegments(80, 18);
      const male = edgeProfile({ ...common, gender: 'male' });
      const female = edgeProfile({ ...common, gender: 'female' });
      // Segundo feature de cada perfil: interior, sin recorte en las esquinas.
      const maleFeature = male.slice(5, 9);
      const femaleFeature = female.slice(5, 9);
      assert(near(maleFeature[3].u - maleFeature[0].u, width + 0.15),
        `tab macho mide ${maleFeature[3].u - maleFeature[0].u}, esperaba ${width + 0.15}`);
      assert(near(femaleFeature[3].u - femaleFeature[0].u, width - 0.15),
        `ranura hembra mide ${femaleFeature[3].u - femaleFeature[0].u}, esperaba ${width - 0.15}`);
      assert(near(maleFeature[1].v, t) && near(femaleFeature[1].v, -t), 'profundidad incorrecta');
    });

    check('el perfil empieza y termina en las esquinas, avanzando sin retroceder', () => {
      for (const gender of ['male', 'female']) {
        const profile = edgeProfile({
          edgeLength: 80, gender, thickness: t, kerf: 0.15, targetTabWidth: 18,
        });
        assert(near(profile[0].u, 0) && near(profile[0].v, 0), `${gender}: no arranca en la esquina`);
        const last = profile[profile.length - 1];
        assert(near(last.u, 80) && near(last.v, 0), `${gender}: no termina en la esquina`);
        for (let i = 1; i < profile.length; i++) {
          assert(profile[i].u >= profile[i - 1].u - TOL, `${gender}: el perfil retrocede en u`);
        }
      }
    });

    check('las piezas cortadas reconstruyen una caja de 200 × 150 × 80 mm', () => {
      const bb = (id) => boundingBox(panel(id).points);
      const front = bb('front'), left = bb('left'), top = bb('top');
      assert(near(front.width, 200) && near(front.height, 80), `front mide ${front.width} × ${front.height}`);
      assert(near(left.width, 150) && near(left.height, 80), `left mide ${left.width} × ${left.height}`);
      assert(near(top.width, 200) && near(top.height, 150), `top mide ${top.width} × ${top.height}`);
      assert(near(box.outer.length, 200) && near(box.outer.width, 150) && near(box.outer.height, 80),
        'dimensiones exteriores incorrectas');
      assert(near(box.inner.length, 194) && near(box.inner.width, 144) && near(box.inner.height, 74),
        'dimensiones interiores incorrectas');
    });

    check('modo "interiores": el espacio útil sale exacto', () => {
      const inner = buildBox({ ...BASE, dimensionMode: 'inner' });
      assert(inner.errors.length === 0, inner.errors.join(' | '));
      assert(near(inner.inner.length, 200) && near(inner.inner.width, 150) && near(inner.inner.height, 80),
        `interior real ${inner.inner.length} × ${inner.inner.width} × ${inner.inner.height}`);
      assert(near(inner.outer.length, 206), 'exterior esperado 206 mm de largo');
    });

    check('el ancho de espiga automático respeta el mínimo de 3 segmentos', () => {
      assert(near(autoTabWidth(BASE), 9), `esperaba 9 mm, obtuve ${autoTabWidth(BASE)}`);
      const small = { ...BASE, length: 40, width: 40, height: 40, thickness: 6 };
      const auto = autoTabWidth(small);
      assert(auto <= Math.min(40, 28) / 3 + TOL, `${auto} mm no deja 3 segmentos en la arista más corta`);
      assert(buildBox({ ...small, tabWidth: auto }).errors.length === 0, 'la caja chica debería ser válida con tab auto');
    });

    check('parámetros imposibles producen errores, no geometría rota', () => {
      const cases = [
        ['material más grueso que la caja', { ...BASE, length: 5, width: 5, thickness: 3 }],
        ['kerf mayor que el grosor', { ...BASE, kerf: 4 }],
        ['grosor cero', { ...BASE, thickness: 0 }],
        ['dimensión negativa', { ...BASE, height: -10 }],
      ];
      for (const [name, params] of cases) {
        const result = buildBox(params);
        assert(result.errors.length > 0, `"${name}" debería producir error`);
        assert(result.panels.length === 0, `"${name}" no debería devolver paneles`);
      }
    });

    check('todos los paneles producen contornos cerrados y sin puntos duplicados', () => {
      for (const p of [...box.panels, ...buildBox(FLAT).panels]) {
        assert(p.points.length >= 4, `${p.id}: muy pocos puntos`);
        for (let i = 1; i < p.points.length; i++) {
          const a = p.points[i - 1], b = p.points[i];
          assert(!(near(a.x, b.x) && near(a.y, b.y)), `${p.id}: punto duplicado en ${i}`);
          assert(Number.isFinite(b.x) && Number.isFinite(b.y), `${p.id}: coordenada no numérica`);
        }
      }
    });

    check('barrido de parámetros: nada explota ni devuelve NaN', () => {
      for (const thickness of [1.5, 3, 6, 9]) {
        for (const kerf of [0, 0.1, 0.3]) {
          for (const lidType of ['finger', 'flat']) {
            for (const dims of [[60, 60, 60], [300, 200, 120], [500, 40, 40]]) {
              const base = { length: dims[0], width: dims[1], height: dims[2], thickness, dimensionMode: 'outer', lidType };
              const result = buildBox({ ...base, kerf, tabWidth: autoTabWidth(base) });
              if (result.errors.length > 0) continue;
              for (const p of result.panels) {
                for (const pt of p.points) {
                  assert(Number.isFinite(pt.x) && Number.isFinite(pt.y),
                    `NaN con t=${thickness} k=${kerf} tapa=${lidType} dims=${dims}`);
                }
              }
            }
          }
        }
      }
    });

    check('tapa plana: la tapa es un rectángulo liso del tamaño exterior', () => {
      const flat = buildBox(FLAT);
      assert(flat.errors.length === 0, flat.errors.join(' | '));
      const lid = flat.panels.find((p) => p.id === 'top');
      assert(lid.points.length === 4, `la tapa tiene ${lid.points.length} puntos, esperaba 4`);
      const bb = boundingBox(lid.points);
      assert(near(bb.width, 200) && near(bb.height, 150),
        `la tapa mide ${bb.width} × ${bb.height}, esperaba 200 × 150`);
    });

    check('tapa plana: el borde superior de las paredes queda recto', () => {
      const flat = buildBox(FLAT);
      for (const id of ['front', 'back', 'left', 'right']) {
        const p = flat.panels.find((q) => q.id === id);
        const onTop = p.points.filter((q) => Math.abs(q.y) < TOL);
        assert(onTop.length === 2,
          `${id}: el borde superior tiene ${onTop.length} vértices, esperaba 2 (recto)`);
        assert(onTop.some((q) => near(q.x, 0)) && onTop.some((q) => near(q.x, p.width)),
          `${id}: el borde superior no va de esquina a esquina`);
      }
    });

    check('tapa plana: pared + tapa dan el alto exterior pedido', () => {
      const flat = buildBox(FLAT);
      const wall = flat.panels.find((p) => p.id === 'front');
      assert(near(wall.height + t, 80),
        `pared ${wall.height} + tapa ${t} = ${wall.height + t}, esperaba 80`);
      assert(near(flat.outer.height, 80), `alto exterior ${flat.outer.height}`);
      assert(near(flat.inner.height, 74), `alto interior ${flat.inner.height}, esperaba 74`);
      // La base sigue encajando con espigas.
      const base = flat.panels.find((p) => p.id === 'bottom');
      assert(base.points.length > 4, 'la base debería conservar sus espigas');
    });

    check('una caja inválida por varios motivos los reporta todos', () => {
      // kerf mayor que el grosor Y material demasiado grueso para la caja: el
      // usuario tiene que ver los dos problemas, no arreglarlos de uno en uno.
      const broken = buildBox({
        length: 3, width: 3, height: 3,
        thickness: 5, kerf: 6, tabWidth: 18,
        dimensionMode: 'outer',
      });
      assert(broken.errors.length === 3,
        `${broken.errors.length} errores, esperaba 3: ${broken.errors.join(' | ')}`);
      assert(broken.errors.some((e) => e.includes('El kerf debe ser menor')),
        'falta el error de kerf');
      assert(broken.errors.some((e) => e.includes('demasiado grueso')),
        'falta el error de material demasiado grueso');
      assert(broken.errors.some((e) => e.includes('no deja pared entre la base')),
        'falta el error de alto insuficiente');
    });

    check('pocketFeature devuelve un rectángulo cerrado con su capa y profundidad', () => {
      const f = pocketFeature({ id: 'groove', x: 1, y: 2, width: 10, height: 3, depth: 1.5 });
      assert(f.id === 'groove', `id ${f.id}`);
      assert(f.layer === 'engrave', `capa ${f.layer}, esperaba engrave`);
      assert(f.kind === 'pocket', `kind ${f.kind}, esperaba pocket`);
      assert(near(f.depth, 1.5), `depth ${f.depth}`);
      assert(f.points.length === 4, `${f.points.length} puntos, esperaba 4`);
      const bb = boundingBox(f.points);
      assert(near(bb.minX, 1) && near(bb.minY, 2) && near(bb.width, 10) && near(bb.height, 3),
        `bbox (${bb.minX}, ${bb.minY}) ${bb.width} × ${bb.height}`);
    });

    check('holeFeature: círculo de 48 lados, sin kerf, capa de corte por defecto', () => {
      const f = holeFeature({ id: 'hinge-hole', cx: 10, cy: 5, diameter: 6 });
      assert(f.id === 'hinge-hole', `id ${f.id}`);
      assert(f.layer === 'cut', `capa ${f.layer}, esperaba cut`);
      assert(f.kind === 'hole', `kind ${f.kind}, esperaba hole`);
      assert(f.points.length === 48, `${f.points.length} puntos, esperaba 48`);
      for (const p of f.points) {
        const d = Math.hypot(p.x - 10, p.y - 5);
        assert(near(d, 3, 1e-6), `punto a distancia ${d} del centro, esperaba 3`);
      }
    });

    check('holeFeature: el kerf agranda el radio para que el agujero terminado dé la medida nominal', () => {

      const pairs = [
        ['front', 'left', 'left', 'left'],
        ['front', 'right', 'right', 'right'],
        ['back', 'left', 'left', 'right'],
        ['back', 'right', 'right', 'left'],
        ['front', 'bottom', 'bottom', 'top'],
        ['back', 'bottom', 'bottom', 'bottom'],
        ['left', 'bottom', 'bottom', 'left'],
        ['right', 'bottom', 'bottom', 'right'],
      ];
      for (const [femaleId, femaleEdge, maleId, maleEdge] of pairs) {
        const female = sp(femaleId).edges[femaleEdge];
        const male = sp(maleId).edges[maleEdge];
        const pair = `${femaleId}.${femaleEdge} ↔ ${maleId}.${maleEdge}`;
        assert(female.gender === 'female', `${pair}: ${femaleId} no es hembra`);
        assert(male.gender === 'male', `${pair}: ${maleId} no es macho`);
        const femaleSpan = female.jointSpan ?? null;
        const maleSpan = male.jointSpan ?? null;
        if (femaleSpan !== null && maleSpan !== null) {
          assert(near(femaleSpan, maleSpan),
            `${pair}: tramos distintos, ${femaleSpan} vs ${maleSpan}`);
          // 'left'/'top' recorren la arista en línea recta (u crece con z o x); 'right'/
          // 'bottom' caminan al revés, así que su jointStart se mide desde el extremo
          // lejano y depende del tamaño propio de la pieza. Comparar el jointStart crudo
          // entre una arista 'right' y una 'left' — o entre dos 'right' de piezas de alto
          // distinto, como el lateral derecho contra el frente — compara cosas que no
          // están en el mismo sistema; hay que traducir las dos al mismo origen antes.
          const globalStart = (panel, edgeKey, spec) => {
            const start = spec.jointStart ?? 0;
            const own = (edgeKey === 'left' || edgeKey === 'right') ? panel.height : panel.width;
            return (edgeKey === 'left' || edgeKey === 'top') ? start : own - start - spec.jointSpan;
          };
          const femaleStart = globalStart(sp(femaleId), femaleEdge, female);
          const maleStart = globalStart(sp(maleId), maleEdge, male);
          assert(near(femaleStart, maleStart),
            `${pair}: arranques distintos en coordenada global, ${femaleStart} vs ${maleStart}`);
        }
        assert((female.startsSolid ?? false) === (male.startsSolid ?? false),
          `${pair}: fases distintas, la espiga no caería en su ranura`);
      }
    });

    check('en el dibujo, la espiga del lateral sólo invade el paso de la tapa lo que se come el haz', () => {
      // La espiga se DIBUJA un kerf más ancha para que, comido su medio kerf a
      // cada lado, la pieza quede en la medida nominal. Por eso en el dibujo
      // asoma medio kerf dentro de la banda de la tapa: eso no es material, es
      // la compensación. Más de medio kerf sí sería espiga de verdad metida en
      // el paso, y la tapa se quedaría a medio entrar.
      // Se mide sobre los puntos del panel, no sobre la fórmula que los generó.
      // El barrido cruza la frontera en pasos de 0.02 mm, más finos que el medio
      // kerf de 0.08: si la validación se cayera, las cajas del otro lado se
      // generarían y este assert las cazaría.
      const configs = [
        SLIDE,
        { ...SLIDE, thickness: 6, lidThickness: 3, tabWidth: 18 },
        { ...SLIDE, length: 150, width: 100, height: 90, thickness: 10, lidThickness: 6, tabWidth: 30 },
        { ...SLIDE, dimensionMode: 'inner', length: 60, width: 60, height: 40, tabWidth: 10 },
        { ...SLIDE, slideClearance: 0.5 },
      ];
      for (let tl = 10.6; tl <= 11.06; tl += 0.02) {
        configs.push({ ...SLIDE, lidThickness: Number(tl.toFixed(2)) });
      }

      let generadas = 0;
      let bloqueadas = 0;
      for (const cfg of configs) {
        const r = buildSlidingBox(cfg);
        if (r.errors.length > 0) { bloqueadas += 1; continue; }
        generadas += 1;
        const wallHeight = r.realOuterHeight;
        const lidLow = r.groove.floor;
        const lidHigh = r.groove.floor + r.lid.thickness;
        for (const [id, beyond] of [
          ['left', (pt, w) => pt.x > w + TOL],
          ['right', (pt) => pt.x < -TOL],
        ]) {
          const panel = r.panels.find((x) => x.id === id);
          const pts = panel.points;
          for (let i = 0; i < pts.length; i++) {
            const a = pts[i];
            const b = pts[(i + 1) % pts.length];
            if (!beyond(a, panel.width) || !beyond(b, panel.width)) continue;
            const z1 = Math.min(wallHeight - a.y, wallHeight - b.y);
            const z2 = Math.max(wallHeight - a.y, wallHeight - b.y);
            const invade = Math.min(z2, lidHigh) - Math.max(z1, lidLow);
            assert(invade <= cfg.kerf / 2 + TOL,
              `${id} (t=${cfg.thickness}, tapa=${r.lid.thickness}): una espiga invade ${invade.toFixed(4)} mm del paso de la tapa, más que el medio kerf (${(cfg.kerf / 2).toFixed(3)})`);
          }
        }
      }
      // Si el barrido cayera entero a un lado de la frontera no probaría nada.
      assert(generadas >= 8 && bloqueadas >= 8,
        `el barrido no cruza la frontera: ${generadas} generadas, ${bloqueadas} bloqueadas`);
    });

      const rh = hinged.hinge.holeDiameter / 2;

        // El círculo se dibuja kerf-compensado (holeFeature): diámetro

        const expectedDrawn = hinged.hinge.holeDiameter + HINGED.kerf;

      const cxLeft = boundingBox(holeLeft.points).minX + boundingBox(holeLeft.points).width / 2;

      // spanY = 74; el agujero queda a em + rh del canto que mira al fondo.
      // En 'left' ese canto es x = spanY (74); en 'right' es x = 0. Espejados.
      const rh = hinged.hinge.holeDiameter / 2;

      const ps = hinged.hinge.pegSize;

    // Verifica que un contorno sea un polígono simple: sin cruces
    // transversales, sin aristas colineares que se solapen más allá de un
    // punto, y sin aristas que rocen un vértice ajeno a mitad de camino.
    // (Si `assertSimplePolygon` ya existe en este archivo por otra rama
    // mergeada, borrar esta definición y usar la que ya está.)
    function assertSimplePolygon(points, label) {
      const n = points.length;
      const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
      const collinear = (o, a, b) => Math.abs(cross(o, a, b)) < 1e-6;
      const segInt = (p1, p2, p3, p4) => {
        const d1 = cross(p3, p4, p1); const d2 = cross(p3, p4, p2);
        const d3 = cross(p1, p2, p3); const d4 = cross(p1, p2, p4);
        return ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0));
      };
      const onSegment = (p, a, b) => {
        if (Math.abs(cross(a, b, p)) > 1e-6) return false;
        return p.x >= Math.min(a.x, b.x) - 1e-7 && p.x <= Math.max(a.x, b.x) + 1e-7
          && p.y >= Math.min(a.y, b.y) - 1e-7 && p.y <= Math.max(a.y, b.y) + 1e-7;
      };
      for (let i = 0; i < n; i++) {
        const a1 = points[i]; const a2 = points[(i + 1) % n];
        for (let j = 0; j < n; j++) {
          const adjacent = j === (i + 1) % n || i === (j + 1) % n;
          if (adjacent || i === j) continue;
          const b1 = points[j]; const b2 = points[(j + 1) % n];
          if (j > i) {
            assert(!segInt(a1, a2, b1, b2), `${label}: cruce transversal entre las aristas ${i} y ${j}`);
            if (collinear(a1, a2, b1) && collinear(a1, a2, b2)) {
              const ox = Math.max(0, Math.min(Math.max(a1.x, a2.x), Math.max(b1.x, b2.x)) - Math.max(Math.min(a1.x, a2.x), Math.min(b1.x, b2.x)));
              const oy = Math.max(0, Math.min(Math.max(a1.y, a2.y), Math.max(b1.y, b2.y)) - Math.max(Math.min(a1.y, a2.y), Math.min(b1.y, b2.y)));
              assert(ox <= 1e-6 && oy <= 1e-6, `${label}: solape colinear entre las aristas ${i} y ${j}`);
            }
          }
          if (j !== i && j !== (i + 1) % n) {
            const v = points[j];
            if (onSegment(v, a1, a2)) {
              const atEnd = Math.hypot(v.x - a1.x, v.y - a1.y) < 1e-7 || Math.hypot(v.x - a2.x, v.y - a2.y) < 1e-7;
              assert(atEnd, `${label}: la arista ${i} roza el vértice ${j} a mitad de camino`);
            }
          }
        }
      }
    }

    function insidePolygonGrip(pt, points) {
      let inside = false;
      for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
        const xi = points[i].x; const yi = points[i].y; const xj = points[j].x; const yj = points[j].y;
        if ((yi > pt.y) !== (yj > pt.y) && pt.x < ((xj - xi) * (pt.y - yi)) / (yj - yi) + xi) inside = !inside;
      }
      return inside;
    }

      assert(box.panels.length === 6, `${box.panels.length} piezas, esperaba 6`);
      assert(box.grip === undefined, 'no debería traer campo grip cuando está desactivada');
      const top = box.panels.find((p) => p.id === 'top');
      assert(!top.features, 'TOP no debería tener features sin la agarradera');
    });

    check('agarradera: tapa plana CON agarradera da 9 piezas, sin errores, con el campo grip', () => {
      const box = buildBox(FLAT_GRIP);
      assert(box.errors.length === 0, box.errors.join(' | '));
      assert(box.panels.length === 9, `${box.panels.length} piezas, esperaba 9`);
      for (const id of ['bottom', 'front', 'left', 'top', 'back', 'right', 'top-insert', 'handle-a', 'handle-b']) {
        assert(box.panels.find((p) => p.id === id), `falta la pieza ${id}`);
      }
      assert(near(box.grip.diameter, 30), `grip.diameter=${box.grip.diameter}, esperaba 30`);
      assert(near(box.grip.stemSpan, 16), `grip.stemSpan=${box.grip.stemSpan}, esperaba 16`);
      const top = box.panels.find((p) => p.id === 'top');
      assert(top.features.length === 1, 'TOP debería tener exactamente un agujero');
    });

    check('agarradera: el agujero de TOP y el de TOP-INSERT quedan alineados una vez centrado el inserto', () => {
      const box = buildBox(FLAT_GRIP);
      const top = box.panels.find((p) => p.id === 'top');
      const insert = box.panels.find((p) => p.id === 'top-insert');
      const topHoleBb = boundingBox(top.features[0].points);
      const insertHoleBb = boundingBox(insert.features[0].points);
      const t = FLAT_GRIP.thickness;
      // TOP-INSERT se centra dentro del hueco interno de TOP: su origen local
      // (0,0) cae en el absoluto (t,t) — un grosor de pared en cada eje.
      const insertHoleAbsX = (insertHoleBb.minX + insertHoleBb.maxX) / 2 + t;
      const insertHoleAbsY = (insertHoleBb.minY + insertHoleBb.maxY) / 2 + t;
      const topHoleX = (topHoleBb.minX + topHoleBb.maxX) / 2;
      const topHoleY = (topHoleBb.minY + topHoleBb.maxY) / 2;
      assert(near(topHoleX, insertHoleAbsX, 0.01), `agujero de TOP en x=${topHoleX}, el de TOP-INSERT (centrado) cae en x=${insertHoleAbsX}`);
      assert(near(topHoleY, insertHoleAbsY, 0.01), `agujero de TOP en y=${topHoleY}, el de TOP-INSERT (centrado) cae en y=${insertHoleAbsY}`);
    });

    check('agarradera: el contorno de las 9 piezas es siempre un polígono simple', () => {
      const box = buildBox(FLAT_GRIP);
      for (const p of box.panels) {
        assertSimplePolygon(p.points, p.id);
      }
    });

    check('agarradera: errores del box completo cuando la agarradera no entra en la caja', () => {
      const tooSmall = buildBox({
        ...FLAT_GRIP, length: 20, width: 20,
      });
      assert(tooSmall.errors.length > 0, 'debería dar error con una caja demasiado chica para la agarradera');
      assert(tooSmall.panels.length === 0, 'no debería devolver piezas si hay error');
    });

    check('agarradera: otros tipos de tapa (finger/sliding/hinged) no se ven afectados por params.grip', () => {
      const withStrayGrip = buildBox({ ...BASE, grip: true });
      const without = buildBox(BASE);
      assert(withStrayGrip.panels.length === without.panels.length, 'un grip:true en lidType finger no debería agregar piezas');
    });

    // --- Divisores internos: posiciones y formas base ---

    check('divisores: evenPositions reparte a distancias iguales, sin tocar los extremos', () => {
      assert(JSON.stringify(evenPositions(144, 3)) === JSON.stringify([36, 72, 108]),
        `evenPositions(144,3) = ${JSON.stringify(evenPositions(144, 3))}`);
      assert(JSON.stringify(evenPositions(114, 2)) === JSON.stringify([38, 76]),
        `evenPositions(114,2) = ${JSON.stringify(evenPositions(114, 2))}`);
      assert(JSON.stringify(evenPositions(100, 0)) === '[]', 'evenPositions con count=0 debería dar []');
      assert(JSON.stringify(evenPositions(100, 1)) === '[50]', 'evenPositions(100,1) debería dar [50]');
    });

    check('divisores: buildLengthDividerPoints sin posiciones da un rectángulo liso de 4 puntos', () => {
      const pts = buildLengthDividerPoints({
        width: 44, height: 114, notchDepth: 22, notchWidth: 2.9, positions: [],
      });
      assert(pts.length === 4, `${pts.length} puntos, esperaba 4`);
      const bb = boundingBox(pts);
      assert(near(bb.width, 44) && near(bb.height, 114), `bbox ${bb.width}x${bb.height}, esperaba 44x114`);
      assertSimplePolygon(pts, 'buildLengthDividerPoints sin muescas');
    });

    check('divisores: buildLengthDividerPoints con 2 muescas reproduce el ejemplo de referencia (Nc=3,Ns=2)', () => {
      const positions = evenPositions(114, 2); // [38, 76] — alto interior 114, 2 divisores de alto
      const pts = buildLengthDividerPoints({
        width: 44, height: 114, notchDepth: 22, notchWidth: 2.9, positions,
      });
      assert(pts.length === 12, `${pts.length} puntos, esperaba 12 (4 esquinas + 2 muescas x 4)`);
      const bb = boundingBox(pts);
      assert(near(bb.width, 44) && near(bb.height, 114), 'las muescas no deberían agrandar el bbox: son cortes hacia adentro');
      assertSimplePolygon(pts, 'buildLengthDividerPoints con 2 muescas');
      // La muesca en v=76 debería llegar hasta u=22 (notchDepth) y no más lejos.
      const notchPoints = pts.filter((p) => near(p.y, 76 + 1.45) || near(p.y, 76 - 1.45));
      assert(notchPoints.some((p) => near(p.x, 22)), 'la muesca en v=76 debería tener un punto en u=22 (notchDepth)');
    });

    check('divisores: buildHeightDividerPoints con 3 muescas reproduce el ejemplo de referencia (Nc=3,Ns=2)', () => {
      const positions = evenPositions(144, 3); // [36, 72, 108] — largo interior 144, 3 divisores de largo
      const pts = buildHeightDividerPoints({
        width: 144, height: 44, notchDepth: 22, notchWidth: 2.9, positions,
      });
      assert(pts.length === 15, `${pts.length} puntos, esperaba 15 (3 esquinas + 3 muescas x 4)`);
      const bb = boundingBox(pts);
      assert(near(bb.width, 144) && near(bb.height, 44), 'las muescas no deberían agrandar el bbox');
      assertSimplePolygon(pts, 'buildHeightDividerPoints con 3 muescas');
      const notchPoints = pts.filter((p) => near(p.x, 72 + 1.45) || near(p.x, 72 - 1.45));
      assert(notchPoints.some((p) => near(p.y, 22)), 'la muesca en u=72 debería tener un punto en v=22 (notchDepth)');
    });

    const failed = results.filter((r) => !r.ok);
    document.getElementById('summary').textContent =
      failed.length === 0
        ? `✅ ${results.length}/${results.length} checks OK`
        : `❌ ${failed.length} de ${results.length} checks fallaron`;
    document.getElementById('results').innerHTML = results
      .map((r) => `<li class="${r.ok ? 'ok' : 'fail'}">${r.ok ? '✔' : '✘'} ${r.name}${r.ok ? '' : ` — ${r.msg}`}</li>`)
      .join('');
    console.log(failed.length === 0 ? 'ALL CHECKS PASSED' : `FAILED: ${failed.map((f) => f.name).join(', ')}`);
  </script>
